<form id="form-borrowings" data-sheet="Borrowings"
    class="bg-white shadow-sm border border-slate-200 rounded-2xl overflow-hidden">
    <div class="p-8 space-y-6">
        <div class="grid grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Peminjam</label>
                <input type="text" name="borrower_name" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Barang Yang Dipinjam</label>
                <input type="text" name="asset_borrowed" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
            </div>
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Tanggal Pengembalian Estimasi</label>
            <input type="date" name="return_date" required
                class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
        </div>
    </div>
    <div class="bg-slate-50 p-8 border-t border-slate-200 text-right"><button type="submit"
            class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-10 rounded-xl transition-all shadow-lg shadow-emerald-200">Catat
            Peminjaman</button></div>
</form>
