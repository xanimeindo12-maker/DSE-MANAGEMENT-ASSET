<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT DSE MANAGEMENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6366f1', // Indigo 500
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#f4f7fe] text-slate-800 font-sans">
    <div class="flex h-screen overflow-hidden p-4 gap-6">
        <!-- Sidebar Navigation Container -->
        <div id="sidebar-container"
            class="w-64 bg-white rounded-[32px] shadow-sm flex flex-col flex-shrink-0 overflow-hidden relative"></div>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col overflow-hidden relative">
            <!-- Global Top Bar -->
            <header class="flex justify-between items-center mb-6 mt-2 flex-shrink-0">
                <!-- Empty left area / Global search placeholder -->
                <div
                    class="flex-1 bg-white rounded-full h-[60px] flex items-center px-6 shadow-sm border border-white max-w-4xl">
                    <!-- Global search can be added here -->
                </div>
                <!-- Right area (Settings, Notifications) -->
                <div class="ml-6 flex items-center gap-4">
                    <button
                        class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm text-slate-400 hover:text-indigo-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                    <button
                        class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm text-slate-400 hover:text-indigo-600 transition-colors relative">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <span
                            class="absolute top-2 right-2 w-3 h-3 bg-red-500 rounded-full border-2 border-white flex items-center justify-center text-[8px] text-white font-bold pb-px">5</span>
                    </button>
                </div>
            </header>

            <!-- Page Title Area (Dynamic) -->
            <div id="page-header" class="mb-6 flex justify-between items-end flex-shrink-0 pl-2 pr-2">
                <div>
                    <h2 id="current-tab-title" class="text-3xl leading-tight font-bold text-slate-800">Loading...</h2>
                    <p id="current-tab-desc"
                        class="text-xs font-semibold text-slate-500 uppercase tracking-widest mt-2">Mohon tunggu
                        sebentar.</p>
                </div>
                <div id="page-actions" class="flex gap-3 items-center">
                    <div id="loading-indicator"
                        class="hidden flex items-center gap-2 text-indigo-600 font-semibold bg-indigo-50 px-4 py-2 rounded-full border border-indigo-100">
                        <div class="loader ease-linear rounded-full border-2 border-t-2 border-slate-200 h-4 w-4"></div>
                        <span class="text-sm">Memproses Data...</span>
                    </div>
                    <!-- Actions specific to view will be placed here -->
                    <div id="view-actions-container"></div>
                </div>
            </div>

            <!-- Page Content Section -->
            <section class="flex-1 overflow-y-auto pb-6 pl-2 pr-2">
                <div id="alert-banner"
                    class="hidden mb-6 p-4 rounded-xl border flex justify-between items-center shadow-sm">
                    <span id="alert-message"></span>
                    <button onclick="hideAlert()" class="text-lg font-bold">&times;</button>
                </div>
                <!-- Component Content Injection -->
                <div id="content-container" class="transition-opacity duration-300 h-full"></div>
            </section>
        </main>
    </div>

    <script src="./app.js" defer></script>
</body>

</html>
