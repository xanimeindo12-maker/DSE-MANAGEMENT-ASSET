<div class="flex flex-col gap-6">
    <!-- Filter Bar -->
    <div class="flex flex-col md:flex-row gap-4">
        <!-- Search -->
        <div class="flex-1 bg-white rounded-full shadow-sm border border-slate-100 flex items-center px-6 h-[52px]">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
            <input type="text" placeholder="Cari aktivitas, nomor perangkat, atau engineer..." class="w-full bg-transparent outline-none text-slate-600 placeholder-slate-400 text-sm ml-3">
        </div>
        
        <!-- Filters -->
        <div class="flex gap-4">
            <div class="bg-white rounded-full shadow-sm border border-slate-100 px-6 h-[52px] flex items-center min-w-[200px] relative">
                <select class="w-full bg-transparent outline-none text-slate-600 text-sm appearance-none cursor-pointer pr-4 font-medium">
                    <option>Semua Kategori</option>
                    <option>Support User</option>
                    <option>Maintenance</option>
                    <option>Monitoring</option>
                </select>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 absolute right-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
            </div>
            <div class="bg-white rounded-full shadow-sm border border-slate-100 px-6 h-[52px] flex items-center min-w-[200px] relative">
                <select class="w-full bg-transparent outline-none text-slate-600 text-sm appearance-none cursor-pointer pr-4 font-medium">
                    <option>Semua Divisi</option>
                    <option>IT Dept</option>
                    <option>HR Dept</option>
                    <option>Finance</option>
                </select>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 absolute right-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
            </div>
        </div>
    </div>

    <!-- Table Card -->
    <div class="bg-white rounded-[32px] shadow-sm border border-slate-100 overflow-hidden">
        <div class="p-6 flex justify-between items-center border-b border-slate-100 bg-white">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" /></svg>
                </div>
                <h3 class="font-bold text-slate-800 tracking-wide uppercase text-sm">MASTER ACTIVITY STREAM</h3>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-100">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">Real-Time Data Feed</span>
                </div>
            </div>
        </div>
        
        <div class="overflow-x-auto min-h-[400px]">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-white text-[10px] uppercase tracking-widest text-slate-400 font-bold border-b border-slate-100">
                        <th class="p-4 pl-6 whitespace-nowrap">NO</th>
                        <th class="p-4 whitespace-nowrap">DATE</th>
                        <th class="p-4 whitespace-nowrap">ASSET NUMBER</th>
                        <th class="p-4 whitespace-nowrap">NAME / USER</th>
                        <th class="p-4 whitespace-nowrap">DIVISI</th>
                        <th class="p-4 whitespace-nowrap">CATEGORY</th>
                        <th class="p-4 whitespace-nowrap">TIME (START-END)</th>
                        <th class="p-4 whitespace-nowrap">ACTUAL</th>
                        <th class="p-4 pr-6 whitespace-nowrap">ENGINEER</th>
                    </tr>
                </thead>
                <tbody class="text-xs font-semibold text-slate-600">
                    <!-- Empty State -->
                    <tr>
                        <td colspan="9" class="p-12 text-center text-slate-500">
                            Tidak ada aktivitas harian yang ditemukan.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
