<div class="flex flex-col gap-6">

                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">MANAJEMEN AKSES & ANGGOTA TIM</p>
            </div>
        </div>
        <div class="flex-1 max-w-lg w-full ml-auto flex items-center gap-4">
            <div class="bg-slate-50 rounded-full border border-slate-200 flex items-center px-5 h-[48px] flex-1">

                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>

                        <th class="p-6 whitespace-nowrap">NAMA LENGKAP</th>
                        <th class="p-6 whitespace-nowrap text-center">ROLE / POSISI</th>

                        <th class="p-6 whitespace-nowrap text-center">STATUS</th>
                        <th class="p-6 text-center whitespace-nowrap">AKSI</th>
                    </tr>
                </thead>
                <tbody class="text-xs font-semibold text-slate-600">
                    <!-- Row 1 -->
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                        <td class="p-6">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">A</div>
                                <span class="text-slate-800 text-sm">Administrator</span>
                            </div>
                        </td>
                        <td class="p-6 text-center">
                            <span class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg text-xs">Administrator</span>
                        </td>
                        <td class="p-6 text-center text-slate-500 font-medium">

                                Active
                            </span>
                        </td>
                        <td class="p-6">
                            <div class="flex items-center justify-center gap-2">
                                <button class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center hover:bg-indigo-500 hover:text-white transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                                </button>
                                <button class="w-8 h-8 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center hover:bg-rose-500 hover:text-white transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>

                            </div>
                        </td>
                    </tr>

            </table>
